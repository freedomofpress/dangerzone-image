# Harden Java's XML handling
#
# Documentation: https://docs.oracle.com/en/java/javase/26/docs/api/java.xml/javax/xml/XMLConstants.html

# Deny access to external DTDs, schemas, and stylesheets from Java's XML
# parsers. This reduces the attack surface of LibreOffice, which uses Java to
# parse untrusted documents.
#
# An empty value means that no protocol is allowed.
javax.xml.accessExternalDTD=
javax.xml.accessExternalSchema=
javax.xml.accessExternalStylesheet=
