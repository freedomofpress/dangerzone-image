# Every night, scan container images (ARM64 and AMD64) in the latest `main` branch
# and fail the CI if critical vulnerabilities are found.

name: Scan nightly
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *" # Run every day at 00:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    strategy:
      matrix:
        runs-on:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build container image
        run: |
          uv run image build \
            --debian-archive-date $(date "+%Y%m%d") \
            --runtime docker
          docker load -i container.tar
      - name: Get image ref
        id: image
        run: echo "ref=$(cat image-id.txt)" >> $GITHUB_OUTPUT
      - name: Scan container
        uses: ./.github/actions/scan-container
        with:
          image: ${{ steps.image.outputs.ref }}
          severity-cutoff: critical
          upload-sarif: false
