# Every night, scan the latest released container images (ARM64 and AMD64)
# and fail the CI if critical vulnerabilities are found.
name: Scan released
on:
  schedule:
    - cron: '0 0 * * *' # Run every day at 00:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Severity cutoff is 'critical' by default, except for the 5th and 20th of
  # month (i.e., biweekly), where we turn it to 'high'.
  SEVERITY_CUTOFF: ${{ github.event_name == 'schedule' && (format('{0}', github.event.schedule) == '0 0 5 * *' || format('{0}', github.event.schedule) == '0 0 20 * *') && 'high' || 'critical' }}

jobs:
  security-scan-released:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-24.04
            arch: i686
          - runs-on: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan container
        uses: ./.github/actions/scan-container
        with:
          image: "ghcr.io/freedomofpress/dangerzone/v1:latest"
          severity-cutoff: ${{ env.SEVERITY_CUTOFF }}
          upload-sarif: true
          sarif-category: container-${{ matrix.arch }}
